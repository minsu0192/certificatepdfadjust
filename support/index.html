<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>오류 신고 | LVMH Fashion Group 업무 자동화 도구</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="/portal.css">
</head>
<body>
  <header class="portal-header">
    <a class="brand" href="/">
      <span class="brand-mark">FG</span>
      <span><strong>LVMH Fashion Group</strong><small>업무 자동화 도구</small></span>
    </a>
    <nav class="header-actions">
      <a href="/">업무 도구</a>
      <span class="creator">Created by <strong>Minsu Bae</strong></span>
    </nav>
  </header>

  <main class="support-shell">
    <span class="eyebrow">오류 신고</span>
    <h1>오류를 알려주세요.</h1>
    <p class="lead">어떤 도구에서 무엇을 하다가 문제가 생겼는지 작성하면, 수정에 필요한 환경 정보와 함께 보고서를 만들 수 있습니다.</p>
    <section class="support-card">
      <div class="support-grid">
        <label class="support-field">
          <span>도구</span>
          <select id="reportTool">
            <option>수입신고필증 정리</option>
            <option>DHL Pre-Alert 메일 본문 정리</option>
            <option>CELINE 크레딧 노트 정리</option>
            <option>FedEx Invoice Check</option>
            <option>DHL Invoice Check</option>
            <option>PDF 업무지원</option>
          </select>
        </label>
        <label class="support-field">
          <span>오류가 발생한 파일명</span>
          <input id="reportFile" placeholder="민감한 내용은 제외 가능">
        </label>
        <label class="support-field support-field--wide">
          <span>오류 메시지</span>
          <textarea id="reportError" placeholder="화면의 오류 상세 정보를 붙여 넣으세요"></textarea>
        </label>
        <label class="support-field support-field--wide">
          <span>발생 과정</span>
          <textarea id="reportSteps" placeholder="예: 폴더 선택 → 처리 중 3번째 파일에서 멈춤"></textarea>
        </label>
      </div>
      <p class="support-note">이 페이지는 내용을 서버로 전송하지 않습니다. 보고서를 복사하거나 TXT 파일로 내려받아 Minsu Bae에게 사내 메신저 또는 이메일로 전달해 주세요.</p>
      <div class="support-actions">
        <button id="copyReport">오류 보고서 복사</button>
        <button id="downloadReport">TXT 다운로드</button>
      </div>
    </section>
  </main>

  <footer>Created by <strong>Minsu Bae</strong><span>·</span>LVMH Fashion Group 업무 자동화 도구</footer>
  <script src="app.js"></script>
</body>
</html>
